<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Operations & Bookings</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .badge-staff {
            background-color: var(--primary);
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .btn {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-primary {
            background-color: var(--primary);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .nav-tab {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .nav-tab.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .form-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .form-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--primary);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        input, select {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-actions {
            display: flex;
            gap: 10px;
        }

        .search-export-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 15px;
        }

        .search-input {
            flex: 1;
            max-width: 400px;
        }

        .table-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
        }

        th {
            background-color: #111827;
            color: var(--text-muted);
            padding: 12px 15px;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 30px !important;
        }

        #connection-status {
            margin-left: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <header>
        <div class="user-info">
            Logged in as: <strong>hh</strong> <span class="badge-staff">STAFF</span>
            <span id="connection-status" class="text-muted">Connecting...</span>
        </div>
        <button class="btn">Sign Out</button>
    </header>

    <nav>
        <button class="nav-tab active">Daily Operations</button>
        <button class="nav-tab">ID & Licenses</button>
    </nav>

    <div class="form-container">
        <div class="form-title">
            <span>📝</span> New Booking
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label>Voucher no.</label>
                <input type="text" id="voucherNo" value="12234" readonly>
            </div>
            <div class="form-group">
                <label>Client ID no.</label>
                <input type="text" id="clientId" placeholder="Enter Passport / ID">
            </div>
            <div class="form-group">
                <label>Customer Name (Auto-fetched)</label>
                <input type="text" id="customerName" placeholder="Auto-filled from Sheet1" readonly>
            </div>
            <div class="form-group">
                <label>Nationality / Authority (Auto-fetched)</label>
                <input type="text" id="nationality" placeholder="Auto-filled from Sheet1" readonly>
            </div>
            <div class="form-group">
                <label>Activity</label>
                <select id="activity">
                    <option value="">Select activity</option>
                </select>
            </div>
            <div class="form-group">
                <label>Supplier</label>
                <input type="text" id="supplier" placeholder="Boat / operator">
            </div>
            <div class="form-group">
                <label>Guide</label>
                <input type="text" id="guide" placeholder="Assigned guide">
            </div>
            <div class="form-group">
                <label>Guests</label>
                <input type="number" id="guests" value="1" min="1">
            </div>
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="bookingDate">
            </div>
            <div class="form-group">
                <label>Pick-up time</label>
                <input type="time" id="pickupTime" value="12:30">
            </div>
            <div class="form-group">
                <label>Payment method</label>
                <select id="paymentMethod">
                    <option value="USD Cash">USD Cash</option>
                    <option value="Credit Card">Credit Card</option>
                    <option value="Online">Online</option>
                </select>
            </div>
            <div class="form-group">
                <label>Total amount</label>
                <input type="number" id="totalAmount" value="0.00" step="0.01">
            </div>
            <div class="form-group">
                <label>Paid amount</label>
                <input type="number" id="paidAmount" value="0.00" step="0.01">
            </div>
            <div class="form-group" style="grid-column: span 2;">
                <label>Notes</label>
                <input type="text" id="notes" placeholder="Cert level, pick-up point...">
            </div>
        </div>
        <div class="form-actions">
            <button class="btn btn-primary" onclick="saveBooking()">Save booking</button>
            <button class="btn" style="background-color: transparent; border: 1px solid var(--border-color); color: var(--text-color);" onclick="clearForm()">Clear form</button>
        </div>
    </div>

    <div class="search-export-bar">
        <input type="text" class="search-input" id="searchBookings" placeholder="Search Bookings..." oninput="filterBookings()">
        <button class="btn btn-primary" style="background-color: #10b981;" onclick="exportCSV()">📥 Export CSV</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>VOUCHER</th>
                    <th>CLIENT ID</th>
                    <th>CUSTOMER NAME</th>
                    <th>NATIONALITY</th>
                    <th>ACTIVITY</th>
                    <th>SUPPLIER</th>
                    <th>GUIDE</th>
                    <th>TIME</th>
                    <th>PAYMENT</th>
                    <th>TOTAL</th>
                    <th>PAID</th>
                    <th>STATUS</th>
                </tr>
            </thead>
            <tbody id="bookings-table-body">
                <tr><td colspan="12" class="empty-state">No bookings recorded yet.</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE"; // ضع رابط السك్రిبت الخاص بك هنا

        let rawData = [];
        let rawBookingsData = [];
        let clientMap = {};

        function loadData() {
            document.getElementById('connection-status').innerText = 'Loading...';
            
            // جلب Sheet1 أولاً لبناء clientMap بشكل تسلسلي صحيح
            const oldScript1 = document.getElementById('jsonp-script1');
            if (oldScript1) oldScript1.remove();
            
            const script1 = document.createElement('script');
            script1.id = 'jsonp-script1';
            script1.src = SCRIPT_URL + "?sheet=Sheet1&callback=callbackSheet1";
            document.body.appendChild(script1);
        }

        window.callbackSheet1 = function(data) {
            if (!data || data.length === 0) return;
            document.getElementById('connection-status').innerText = 'Connected 🟢';
            rawData = data;
            
            const headers = data[0].map(h => String(h).trim().toLowerCase());
            const idIndex = headers.indexOf('id_number');
            const nameIndex = headers.indexOf('full_name');
            const authorityIndex = headers.indexOf('issuing_authority');

            clientMap = {};
            data.slice(1).forEach(row => {
                const rawId = idIndex !== -1 ? row[idIndex] : (row[3] || row[0]);
                const id = String(rawId || '').trim().toLowerCase();
                const name = nameIndex !== -1 ? row[nameIndex] : row[0];
                const authority = authorityIndex !== -1 ? row[authorityIndex] : (row[2] || 'N/A');

                if (id) {
                    clientMap[id] = { name: name || 'Unknown', nationality: authority || 'N/A' };
                }
            });

            // بعد اكتمال جلب الشيت الأول وبناء الخريطة، يتم استدعاء الشيت الثاني فوراً
            const oldScript2 = document.getElementById('jsonp-script2');
            if (oldScript2) oldScript2.remove();

            const script2 = document.createElement('script');
            script2.id = 'jsonp-script2';
            script2.src = SCRIPT_URL + "?sheet=Sheet2&callback=callbackSheet2";
            document.body.appendChild(script2);
        };

        window.callbackSheet2 = function(data) {
            if (!data || data.length <= 1) {
                document.getElementById('bookings-table-body').innerHTML = '<tr><td colspan="12" class="empty-state">No bookings recorded yet.</td></tr>';
                return;
            }
            rawBookingsData = data.slice(1);
            renderBookingsTable(rawBookingsData);
        };

        function renderBookingsTable(rows) {
            const tbody = document.getElementById('bookings-table-body');
            if (!rows || rows.length === 0) {
                tbody.innerHTML = '<tr><td colspan="12" class="empty-state">No bookings recorded yet.</td></tr>';
                return;
            }

            tbody.innerHTML = rows.map(row => `
                <tr>
                    <td>${row[0] || ''}</td>
                    <td>${row[1] || ''}</td>
                    <td>${row[2] || ''}</td>
                    <td>${row[3] || ''}</td>
                    <td>${row[4] || ''}</td>
                    <td>${row[5] || ''}</td>
                    <td>${row[6] || ''}</td>
                    <td>${row[7] || ''}</td>
                    <td>${row[8] || ''}</td>
                    <td>${row[9] || ''}</td>
                    <td>${row[10] || ''}</td>
                    <td>${row[11] || 'Pending'}</td>
                </tr>
            `).join('');
        }

        // Auto-fetch client details when typing Client ID
        document.getElementById('clientId').addEventListener('input', function() {
            const inputId = this.value.trim().toLowerCase();
            if (clientMap[inputId]) {
                document.getElementById('customerName').value = clientMap[inputId].name;
                document.getElementById('nationality').value = clientMap[inputId].nationality;
            } else {
                document.getElementById('customerName').value = '';
                document.getElementById('nationality').value = '';
            }
        });

        function saveBooking() {
            alert('Booking saved successfully (Demo)');
        }

        function clearForm() {
            document.getElementById('clientId').value = '';
            document.getElementById('customerName').value = '';
            document.getElementById('nationality').value = '';
            document.getElementById('supplier').value = '';
            document.getElementById('guide').value = '';
            document.getElementById('totalAmount').value = '0.00';
            document.getElementById('paidAmount').value = '0.00';
            document.getElementById('notes').value = '';
        }

        function filterBookings() {
            const query = document.getElementById('searchBookings').value.toLowerCase();
            const filtered = rawBookingsData.filter(row => 
                row.some(cell => String(cell).toLowerCase().includes(query))
            );
            renderBookingsTable(filtered);
        }

        function exportCSV() {
            let csvContent = "data:text/csv;charset=utf-8,";
            rawBookingsData.forEach(row => {
                csvContent += row.join(",") + "\r\n";
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "bookings_export.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // تنفيذ عملية الجلب عند تحميل الصفحة
        window.onload = function() {
            loadData();
        };
    </script>
</body>
</html>

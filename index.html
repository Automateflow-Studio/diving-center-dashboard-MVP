<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diving Center Management Pro</title>
    <!-- XLSX Library for Excel Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 24px;
            min-height: 100vh;
        }

        /* Top Navigation Tabs */
        .tab-navigation {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 8px;
        }

        .tab-btn {
            background: transparent;
            color: #94a3b8;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: #0284c7;
            color: white;
        }

        .tab-btn:hover:not(.active) {
            background-color: #1e293b;
            color: #f8fafc;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #1e293b;
        }

        .title-group h1 {
            font-size: 1.5rem;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-refresh {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
        }

        .btn-refresh:hover {
            background-color: #0369a1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .stat-title {
            font-size: 0.875rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.875rem;
            font-weight: bold;
        }

        .status-connected { color: #4ade80; }
        .status-error { color: #f87171; }

        /* Card Section Styling */
        .card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            margin-bottom: 24px;
        }

        .card-title {
            color: #38bdf8;
            margin-bottom: 16px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Form Grid Layout */
        .booking-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.8rem;
            color: #94a3b8;
            font-weight: 500;
        }

        .form-control {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: white;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .form-control:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .form-actions {
            display: flex;
            gap: 12px;
        }

        .btn-submit {
            background-color: #0f766e;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-submit:hover { background-color: #115e59; }

        .btn-clear {
            background-color: transparent;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-clear:hover { background-color: #334155; }

        /* Upload Card Styling */
        .upload-form {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .file-input {
            background: #0f172a;
            color: white;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            cursor: pointer;
        }

        .file-input::file-selector-button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }

        .btn-process {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
        }

        .search-input {
            flex: 1;
            padding: 12px 16px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }

        .btn-export {
            background-color: #16a34a;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .table-container {
            background-color: #1e293b;
            border-radius: 8px;
            border: 1px solid #334155;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.875rem;
        }

        th {
            background-color: #0f172a;
            color: #38bdf8;
            padding: 14px 16px;
            font-weight: 600;
            border-bottom: 1px solid #334155;
            white-space: nowrap;
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #334155;
            color: #e2e8f0;
            white-space: nowrap;
        }

        tr:hover td { background-color: #182234; }

        .empty-state {
            padding: 40px;
            text-align: center;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <!-- Tab Navigation Bar -->
    <div class="tab-navigation">
        <button class="tab-btn active" onclick="switchTab('daily-operations')">Daily Operations</button>
        <button class="tab-btn" onclick="switchTab('id-licenses')">ID & Licenses</button>
    </div>

    <!-- TAB 1: Daily Operations -->
    <div id="daily-operations" class="tab-content active">
        <div class="card">
            <h3 class="card-title">📝 New Booking</h3>
            <form id="bookingForm" onsubmit="submitBooking(event)">
                <div class="booking-grid">
                    <div class="form-group">
                        <label>Voucher no.</label>
                        <input type="text" id="voucherNo" class="form-control" placeholder="12234" required>
                    </div>
                    <div class="form-group">
                        <label>Client ID no.</label>
                        <input type="text" id="clientID" class="form-control" placeholder="Passport / national ID">
                    </div>
                    <div class="form-group">
                        <label>Customer name</label>
                        <input type="text" id="customerName" class="form-control" placeholder="Full name as on ID" required>
                    </div>
                    <div class="form-group">
                        <label>Nationality</label>
                        <input type="text" id="nationality" class="form-control" placeholder="Egypt">
                    </div>
                    <div class="form-group">
                        <label>Activity</label>
                        <select id="activity" class="form-control">
                            <option value="">Select activity</option>
                            <option value="Diving">Diving</option>
                            <option value="Snorkeling">Snorkeling</option>
                            <option value="Speedboat">Speedboat</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Supplier</label>
                        <input type="text" id="supplier" class="form-control" placeholder="Boat / operator">
                    </div>
                    <div class="form-group">
                        <label>Guide</label>
                        <input type="text" id="guide" class="form-control" placeholder="Assigned guide">
                    </div>
                    <div class="form-group">
                        <label>Guests</label>
                        <input type="number" id="guests" class="form-control" value="1" min="1">
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="bookingDate" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Pick-up time</label>
                        <input type="time" id="pickupTime" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Payment method</label>
                        <select id="paymentMethod" class="form-control">
                            <option value="USD Cash">USD Cash</option>
                            <option value="EUR Credit">EUR Credit</option>
                            <option value="Card">Card</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Total amount</label>
                        <input type="number" id="totalAmount" class="form-control" step="0.01" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label>Paid amount</label>
                        <input type="number" id="paidAmount" class="form-control" step="0.01" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label>Notes</label>
                        <input type="text" id="notes" class="form-control" placeholder="Cert level, pick-up point...">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit" id="saveBookingBtn">Save booking</button>
                    <button type="reset" class="btn-clear">Clear form</button>
                    <span id="bookingStatus" style="align-self: center; font-weight: 500;"></span>
                </div>
            </form>
        </div>

        <div class="controls-bar">
            <input type="text" id="search-booking" class="search-input" placeholder="🔍 Search Bookings..." oninput="filterBookings()">
            <button class="btn-export" onclick="exportToExcel('bookings-table')">📊 Export CSV</button>
        </div>

        <div class="table-container">
            <table id="bookings-table">
                <thead>
                    <tr>
                        <th>Voucher</th>
                        <th>Customer</th>
                        <th>Client ID</th>
                        <th>Activity</th>
                        <th>Supplier</th>
                        <th>Guide</th>
                        <th>Time</th>
                        <th>Payment</th>
                        <th>Total</th>
                        <th>Paid</th>
                    </tr>
                </thead>
                <tbody id="bookings-table-body">
                    <tr><td colspan="10" class="empty-state">Loading bookings data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- TAB 2: ID & Licenses -->
    <div id="id-licenses" class="tab-content">
        <div class="header">
            <div class="title-group">
                <h1>🪪 ID & License Management Dashboard</h1>
            </div>
            <button class="btn-refresh" onclick="loadData()">🔄 Refresh Data</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Connection Status</div>
                <div class="stat-value" id="connection-status">Connecting...</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Total Records</div>
                <div class="stat-value" id="total-records">0</div>
            </div>
        </div>

        <div class="card">
            <h3 class="card-title">📤 Upload New Passport / ID Document</h3>
            <form id="uploadForm" class="upload-form" onsubmit="uploadDocument(event)">
                <input type="file" id="fileInput" class="file-input" accept="image/*,application/pdf" required>
                <button type="submit" id="uploadBtn" class="btn-process">✨ Process Document</button>
                <span id="uploadStatus" class="upload-status"></span>
            </form>
        </div>

        <div class="controls-bar">
            <input type="text" id="search-input" class="search-input" placeholder="🔍 Search documents..." oninput="filterData()">
            <button class="btn-export" onclick="exportToExcel('data-table')">📊 Export to Excel</button>
        </div>

        <div class="table-container">
            <table id="data-table">
                <thead><tr id="table-header"></tr></thead>
                <tbody id="table-body">
                    <tr><td colspan="100%" class="empty-state">Loading documents data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwBAFTsyRTu0lL5VfUL9P7XLl_jR7dexGy_FKXEfnc1Z-kozZpwezhi4xNvayA6DrhsZQ/exec";
        const N8N_WEBHOOK_URL = "https://Automateflow-n8n.rinoosolutions.com/webhook/upload-passport";
        
        let rawData = [];
        let rawBookingsData = [];

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        async function submitBooking(e) {
            e.preventDefault();
            const btn = document.getElementById('saveBookingBtn');
            const status = document.getElementById('bookingStatus');
            btn.disabled = true;
            status.style.color = "#38bdf8";
            status.innerText = "⏳ Saving to Sheet2...";

            const payload = {
                voucherNo: document.getElementById('voucherNo').value,
                clientID: document.getElementById('clientID').value,
                customerName: document.getElementById('customerName').value,
                nationality: document.getElementById('nationality').value,
                activity: document.getElementById('activity').value,
                supplier: document.getElementById('supplier').value,
                guide: document.getElementById('guide').value,
                guests: document.getElementById('guests').value,
                bookingDate: document.getElementById('bookingDate').value,
                pickupTime: document.getElementById('pickupTime').value,
                paymentMethod: document.getElementById('paymentMethod').value,
                totalAmount: document.getElementById('totalAmount').value,
                paidAmount: document.getElementById('paidAmount').value,
                notes: document.getElementById('notes').value
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                status.style.color = "#4ade80";
                status.innerText = "✅ Saved Successfully!";
                
                addBookingToTable(payload);
                document.getElementById('bookingForm').reset();
                setTimeout(() => status.innerText = "", 3000);
            } catch (err) {
                status.style.color = "#f87171";
                status.innerText = "❌ Error saving booking";
            } finally {
                btn.disabled = false;
            }
        }

        function addBookingToTable(data) {
            const tbody = document.getElementById('bookings-table-body');
            if (tbody.querySelector('.empty-state')) tbody.innerHTML = '';
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${data.voucherNo}</td>
                <td>${data.customerName}<br><small style="color:#94a3b8">${data.nationality}</small></td>
                <td>${data.clientID}</td>
                <td>${data.activity}</td>
                <td>${data.supplier}</td>
                <td>${data.guide}</td>
                <td>${data.pickupTime}</td>
                <td>${data.paymentMethod}</td>
                <td>$${data.totalAmount}</td>
                <td>$${data.paidAmount}</td>
            `;
            tbody.prepend(tr);
        }

        function loadData() {
            document.getElementById('connection-status').innerText = 'Loading...';
            
            // Fetch Sheet1 (ID Data)
            const oldScript1 = document.getElementById('jsonp-script1');
            if (oldScript1) oldScript1.remove();
            const script1 = document.createElement('script');
            script1.id = 'jsonp-script1';
            script1.src = SCRIPT_URL + "?sheet=Sheet1&callback=callbackSheet1";
            document.body.appendChild(script1);

            // Fetch Sheet2 (Bookings Data)
            const oldScript2 = document.getElementById('jsonp-script2');
            if (oldScript2) oldScript2.remove();
            const script2 = document.createElement('script');
            script2.id = 'jsonp-script2';
            script2.src = SCRIPT_URL + "?sheet=Sheet2&callback=callbackSheet2";
            document.body.appendChild(script2);
        }

        window.callbackSheet1 = function(data) {
            if (!data || data.length === 0) return;
            document.getElementById('connection-status').innerText = 'Connected 🟢';
            document.getElementById('connection-status').className = 'stat-value status-connected';
            rawData = data;
            renderTable(rawData);
        };

        window.callbackSheet2 = function(data) {
            if (!data || data.length <= 1) {
                document.getElementById('bookings-table-body').innerHTML = '<tr><td colspan="10" class="empty-state">No bookings recorded yet.</td></tr>';
                return;
            }
            rawBookingsData = data;
            renderBookingsTable(data.slice(1));
        };

        function renderBookingsTable(rows) {
            const tbody = document.getElementById('bookings-table-body');
            tbody.innerHTML = '';
            rows.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row[0] || ''}</td>
                    <td>${row[2] || ''}<br><small style="color:#94a3b8">${row[3] || ''}</small></td>
                    <td>${row[1] || ''}</td>
                    <td>${row[4] || ''}</td>
                    <td>${row[5] || ''}</td>
                    <td>${row[6] || ''}</td>
                    <td>${row[9] || ''}</td>
                    <td>${row[10] || ''}</td>
                    <td>$${row[11] || '0'}</td>
                    <td>$${row[12] || '0'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterBookings() {
            const query = document.getElementById('search-booking').value.toLowerCase().trim();
            if (!query) {
                renderBookingsTable(rawBookingsData.slice(1));
                return;
            }
            const filtered = rawBookingsData.slice(1).filter(row => 
                row.some(cell => String(cell).toLowerCase().includes(query))
            );
            renderBookingsTable(filtered);
        }

        function renderTable(data) {
            const headerRow = document.getElementById('table-header');
            const tableBody = document.getElementById('table-body');
            if (data.length === 0) return;

            const headers = data[0];
            headerRow.innerHTML = '<th>#</th>';
            headers.forEach(h => headerRow.innerHTML += `<th>${h}</th>`);

            const rows = data.slice(1);
            document.getElementById('total-records').innerText = rows.length;
            tableBody.innerHTML = '';
            rows.forEach((row, index) => {
                let tr = '<tr>';
                tr += `<td>${index + 1}</td>`;
                row.forEach(cell => tr += `<td>${cell || ''}</td>`);
                tr += '</tr>';
                tableBody.innerHTML += tr;
            });
        }

        function exportToExcel(tableId) {
            const table = document.getElementById(tableId);
            const workbook = XLSX.utils.table_to_book(table);
            XLSX.writeFile(workbook, `Export_${tableId}.xlsx`);
        }

        async function uploadDocument(event) {
            event.preventDefault();
            const fileInput = document.getElementById('fileInput');
            const statusText = document.getElementById('uploadStatus');
            const uploadBtn = document.getElementById('uploadBtn');

            if (!fileInput.files[0]) return;

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            uploadBtn.disabled = true;
            statusText.style.color = "#38bdf8";
            statusText.innerText = "⏳ Processing...";

            try {
                const response = await fetch(N8N_WEBHOOK_URL, { method: "POST", body: formData });
                if (response.ok) {
                    statusText.style.color = "#4ade80";
                    statusText.innerText = "✅ Successfully Processed!";
                    fileInput.value = "";
                    setTimeout(loadData, 2000);
                }
            } catch (err) {
                statusText.style.color = "#f87171";
                statusText.innerText = "❌ Error uploading.";
            } finally {
                uploadBtn.disabled = false;
            }
        }

        document.getElementById('bookingDate').valueAsDate = new Date();
        window.onload = loadData;
    </script>
</body>
</html>
